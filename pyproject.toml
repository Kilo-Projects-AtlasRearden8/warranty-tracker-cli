[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warranty-tracker"
version = "0.1.0"
description = "Local-first CLI to track warranties and expiration dates for appliances, electronics, and gear."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Asdale Dynamics, LLC" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
warranty-tracker = "warranty_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["warranty_tracker*"]
